[package]
# Port of Refined Storage - Quartz Arsenal 1.0.8
# (refinedmods/refinedstorage-quartz-arsenal, MIT). Minecraft Java 1.21.1
# NeoForge; the port targets Horizon 26.3 at the pins in horizon-mod.toml.
# The mod's whole contents are two items (a wireless crafting grid and its
# creative variant) declared from the jar's own assets, data and lang; this
# crate carries the campaign's pure `runtime.rs` census, which pins the ids, the
# four carried model paths, the recipe's shape, the 18 locales and the manifest
# values. The textures, models, lang and recipe are the upstream mod's own MIT
# files; the port stays local until the maintainer approves publishing
# (ARCHITECTURE.md §8).
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "refinedstorage_quartz_arsenal"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Refined Storage - Quartz Arsenal's two wireless crafting grids for Horizon"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command (the launcher builds against its own copy of the same build). Any other
# registry dependency must be pinned with `horizon-launcher native-lock .` first.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
